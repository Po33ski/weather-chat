[project]
name = "weather-center-backend"
version = "0.1.0"
description = "FastAPI backend for Weather Center Chat with AI integration"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.14",
    "uvicorn[standard]>=0.35.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "google-adk>=1.5.0",
    "google-genai>=0.3.0",
    "tzdata>=2025.1",
    "tavily-python>=0.5.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "agent_system"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]

[tool.ruff.lint.per-file-ignores]
# LLM prompt and schema-template strings: long lines and intra-string
# whitespace are part of the prompt content, not code style.
"**/prompt.py" = ["E501", "W291", "W293"]
"**/templates/*.py" = ["E501", "W291", "W293"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
