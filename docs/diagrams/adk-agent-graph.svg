<svg viewBox="0 0 1100 780" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1100" height="780" fill="#f8fafc"/>

  <!-- Root package -->
  <rect x="20" y="340" width="220" height="60" rx="10" fill="#1e293b"/>
  <text x="130" y="365" text-anchor="middle" fill="#ffffff" font-size="13.5" font-weight="700">multi_tool_agent/</text>
  <text x="130" y="382" text-anchor="middle" fill="#cbd5e1" font-size="10">backend/agent_system/src/</text>

  <!-- Connectors: root -> top-level -->
  <path d="M240,370 L270,370 L270,47 L300,47" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <path d="M240,370 L270,370 L270,117 L300,117" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <path d="M240,370 L270,370 L270,272 L300,272" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <path d="M240,370 L270,370 L270,552 L300,552" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <path d="M240,370 L270,370 L270,722 L300,722" stroke="#94a3b8" stroke-width="2" fill="none"/>

  <!-- agent.py -->
  <rect x="300" y="20" width="240" height="54" rx="8" fill="#2563eb"/>
  <text x="420" y="41" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="700">agent.py</text>
  <text x="420" y="57" text-anchor="middle" fill="#dbeafe" font-size="9.5">root Agent: sub_agents=[...] transfer</text>
  <text x="420" y="69" text-anchor="middle" fill="#dbeafe" font-size="9.5">+ tools=[AgentTool(...)] for combined path</text>

  <!-- prompt.py -->
  <rect x="300" y="90" width="240" height="54" rx="8" fill="#2563eb"/>
  <text x="420" y="111" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="700">prompt.py</text>
  <text x="420" y="127" text-anchor="middle" fill="#dbeafe" font-size="9.5">routing + COMBINED QUERY LOGIC</text>
  <text x="420" y="139" text-anchor="middle" fill="#dbeafe" font-size="9.5">+ shared context template</text>

  <!-- sub_agents/ header -->
  <rect x="300" y="250" width="240" height="44" rx="8" fill="#2563eb"/>
  <text x="420" y="277" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="700">sub_agents/</text>

  <!-- Connectors sub_agents -> children -->
  <path d="M540,272 L570,272 L570,223 L650,223" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <path d="M540,272 L570,272 L570,279 L650,279" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <path d="M540,272 L570,272 L570,335 L650,335" stroke="#94a3b8" stroke-width="2" fill="none"/>

  <rect x="650" y="200" width="290" height="46" rx="8" fill="#0891b2"/>
  <text x="795" y="219" text-anchor="middle" fill="#ffffff" font-size="11.5" font-weight="700">get_weather/</text>
  <text x="795" y="234" text-anchor="middle" fill="#ecfeff" font-size="9.5">agent.py (weather-json contract) · prompt.py</text>

  <rect x="650" y="256" width="290" height="46" rx="8" fill="#0891b2"/>
  <text x="795" y="275" text-anchor="middle" fill="#ffffff" font-size="11.5" font-weight="700">travel_advice/</text>
  <text x="795" y="290" text-anchor="middle" fill="#ecfeff" font-size="9.5">agent.py (3 weather-adapted suggestions) · prompt.py</text>

  <rect x="650" y="312" width="290" height="46" rx="8" fill="#0891b2"/>
  <text x="795" y="331" text-anchor="middle" fill="#ffffff" font-size="11.5" font-weight="700">search_hotels/</text>
  <text x="795" y="346" text-anchor="middle" fill="#ecfeff" font-size="9.5">agent.py (wires search_hotels + fallback link) · prompt.py</text>

  <!-- tools/ header -->
  <rect x="300" y="530" width="240" height="44" rx="8" fill="#2563eb"/>
  <text x="420" y="557" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="700">tools/</text>

  <!-- Connectors tools -> children -->
  <path d="M540,552 L570,552 L570,528 L650,528" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <path d="M540,552 L570,552 L570,610 L650,610" stroke="#94a3b8" stroke-width="2" fill="none"/>

  <rect x="650" y="490" width="300" height="76" rx="8" fill="#0891b2"/>
  <text x="800" y="508" text-anchor="middle" fill="#ffffff" font-size="11.5" font-weight="700">weather tools</text>
  <text x="800" y="524" text-anchor="middle" fill="#ecfeff" font-size="9.5">get_current_weather.py · get_forecast.py</text>
  <text x="800" y="538" text-anchor="middle" fill="#ecfeff" font-size="9.5">get_history_weather.py</text>
  <text x="800" y="554" text-anchor="middle" fill="#cffafe" font-size="9">→ Visual Crossing API</text>

  <rect x="650" y="578" width="300" height="90" rx="8" fill="#0891b2"/>
  <text x="800" y="596" text-anchor="middle" fill="#ffffff" font-size="11.5" font-weight="700">hotel tools</text>
  <text x="800" y="612" text-anchor="middle" fill="#ecfeff" font-size="9.5">search_hotels.py — Tavily search + currency bias</text>
  <text x="800" y="626" text-anchor="middle" fill="#ecfeff" font-size="9.5">build_hotel_booking_link.py — fallback booking.com link</text>
  <text x="800" y="640" text-anchor="middle" fill="#ecfeff" font-size="9.5">hotel_locale.py — shared PLN/USD locale helper</text>
  <text x="800" y="656" text-anchor="middle" fill="#cffafe" font-size="9">→ Tavily API → booking.com / hotels.com / tripadvisor.com</text>

  <!-- templates/ -->
  <rect x="300" y="695" width="240" height="60" rx="8" fill="#2563eb"/>
  <text x="420" y="716" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="700">templates/</text>
  <text x="420" y="732" text-anchor="middle" fill="#dbeafe" font-size="9.5">json_format.py — all schemas incl. combined-json</text>
  <text x="420" y="745" text-anchor="middle" fill="#dbeafe" font-size="9.5">context_template.py — shared session context</text>
</svg>
