name: Deploy Weather Center Chat

on:
  push:
    branches: [ deploy ]

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # Lint, typecheck, and unit tests must pass before anything is built.
  quality:
    uses: ./.github/workflows/ci.yml

  build:
    needs: quality
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image (Nginx + FastAPI)
      run: |
        docker build -t weather-center-chat:ci .

    - name: Save Docker image as artifact
      run: |
        docker save weather-center-chat:ci -o image.tar

    - name: Upload image artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-image
        path: image.tar

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Download image artifact
      uses: actions/download-artifact@v4
      with:
        name: app-image
        path: .
    - name: Load Docker image
      run: |
        docker load -i image.tar

    - name: Run container
      run: |
        docker run -d --name app -p 8080:80 \
          -e VISUAL_CROSSING_API_KEY='${{ secrets.VISUAL_CROSSING_API_KEY }}' \
          -e GOOGLE_API_KEY='${{ secrets.GOOGLE_API_KEY }}' \
          -e TAVILY_API_KEY='${{ secrets.TAVILY_API_KEY }}' \
          -e MODEL='gemini-2.0-flash' \
          -e DISABLE_WEB_DRIVER='0' \
          -e ENVIRONMENT='production' \
          weather-center-chat:ci

    - name: Wait for health via Nginx
      run: |
        for i in {1..120}; do
          if curl -fsS http://localhost:8080/api/health >/dev/null; then echo "nginx+backend up"; exit 0; fi
          sleep 1
        done
        echo "service not ready"; docker logs app || true; exit 1

    - name: Install test dependencies
      run: pip install requests

    - name: Run integration tests
      run: |
        BACKEND_BASE_URL=http://localhost:8080 python test_local.py
      env:
        VISUAL_CROSSING_API_KEY: ${{ secrets.VISUAL_CROSSING_API_KEY }}
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

    - name: Teardown container
      if: always()
      run: |
        docker logs app || true
        docker rm -f app || true

  # The image reaches GHCR only after quality checks and the smoke test pass.
  push:
    needs: smoke-test
    runs-on: ubuntu-latest
    steps:
    - name: Set lowercase image name
      run: echo "IMAGE_NAME=$(echo ghcr.io/${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Download image artifact
      uses: actions/download-artifact@v4
      with:
        name: app-image
        path: .

    - name: Load Docker image
      run: |
        docker load -i image.tar

    - name: Tag and push to GHCR
      run: |
        docker tag weather-center-chat:ci ${{ env.IMAGE_NAME }}:latest
        docker push ${{ env.IMAGE_NAME }}:latest

  render_deploy:
    needs: push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/deploy'
    steps:
    - name: Notify deployment status
      run: echo "✅ Tests passed — Render deploys automatically via dashboard webhook"

  azure_deploy:
    needs: push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/deploy'
    steps:
    - name: Set lowercase image name
      run: echo "IMAGE_NAME=$(echo ghcr.io/${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

    - name: Log in to Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy to Azure Container Apps
      uses: azure/container-apps-deploy-action@v1
      with:
        containerAppName: weather-chat-env
        resourceGroup: weather-chat-env
        imageToDeploy: ${{ env.IMAGE_NAME }}:latest
        registryUrl: ghcr.io
        registryUsername: po33ski
        registryPassword: ${{ secrets.GHCR_PAT }}
